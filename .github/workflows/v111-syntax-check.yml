name: V111 Syntax Check
on:
  push:
    branches: [v111-implementation]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: node --check v111/features.js
      - run: node --check v111/video-upload.js
      - run: node --check backend/scripts/start-v111.js
      - run: node -e "const p=require('./package.json'); if(p.version!=='111.0.0') process.exit(1)"
